name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck frontend
        run: npm run typecheck:frontend
      - name: Typecheck shared modules
        run: npm run typecheck:modules
      - name: Run domain tests
        run: npm run test:domain
      - name: Build frontend
        run: npm run build -- --base=/beat-stride-platform/

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck API
        run: npm run typecheck
      - name: Build API
        run: npm run build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck worker
        run: npm run typecheck
      - name: Build worker
        run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: distribution
          POSTGRES_PASSWORD: distribution
          POSTGRES_DB: distribution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distribution -d distribution_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://distribution:distribution@localhost:5432/distribution_test
      NODE_ENV: test
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install migration dependencies
        run: npm install --no-audit --no-fund
      - name: Apply migrations on PostgreSQL
        run: npm run migrate
      - name: Verify migration replay is idempotent
        run: npm run migrate
      - name: Build API for integration checks
        run: npm run build
      - name: Verify tenant isolation and permission boundaries
        run: |
          PORT=3100 node dist/main.js > /tmp/distribution-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/api/v1/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/api/v1/health/live >/dev/null || { cat /tmp/distribution-api.log; exit 1; }
          API_BASE_URL=http://127.0.0.1:3100/api/v1 node scripts/tenant-isolation.mjs || { cat /tmp/distribution-api.log; exit 1; }
